name: Tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.19"
          python-version: "3.13"
          enable-cache: true
      - name: Install locked development dependencies
        run: uv sync --locked --group specs
      - name: Check Python style
        run: |
          uv run --locked ruff check tests scripts
          uv run --locked ruff format --check tests scripts
      - name: Run offline suite
        run: uv run --locked --group specs python -m pytest
